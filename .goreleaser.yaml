version: 2

builds:
  - id: mcputils
    binary: mcputils
    main: ./main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

brews:
  - name: mcputils
    repository:
      owner: zeshanziya
      name: homebrew-mcputils
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/zeshanziya/mcputils"
    description: "CLI to manage MCP server configs and profiles for Claude Code"
    license: "MIT"
    test: |
      system "#{bin}/mcputils --help"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
